[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[project]
name = "zigpy-deconz"
dynamic = ["version"]
description = "A library which communicates with Deconz radios for zigpy"
urls = {repository = "https://github.com/zigpy/zigpy-deconz"}
authors = [
    {name = "Daniel Schmidt", email = "schmidt.d@aon.at"}
]
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.8"
dependencies = [
    "voluptuous",
    "zigpy>=2.4.0",
    'async-timeout; python_version<"3.11"',
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[project.optional-dependencies]
testing = [
    "pytest>=7.1.2",
    "pytest-asyncio>=0.19.0",
    "pytest-timeout>=2.1.0",
    "pytest-mock>=3.8.2",
    "pytest-cov>=3.0.0",
]

[tool.setuptools-git-versioning]
enabled = true

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "C", # complexity
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes/autoflake
    "I", # isort
    "SIM", # flake8-simplify
    "UP", # pyupgrade
    "W", # pycodestyle
]
ignore = [
    "E501", # line too long
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D202", # No blank lines allowed after function docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F811",
    "F401",
    "F403",
    "SIM117", # merging needs parenthesized `with`, but requires-python is still >=3.8
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["zigpy_deconz", "tests"]
forced-separate = ["tests"]
combine-as-imports = true

[tool.mypy]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.codespell]
ignore-words-list = ["IntStruct"]
skip = ["./.*", "tests/*", "pyproject.toml"]
quiet-level = 2

[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "if (typing\\.)?TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
